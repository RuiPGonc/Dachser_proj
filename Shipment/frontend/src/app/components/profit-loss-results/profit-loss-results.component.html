<div class="table-scroll-container">
<table mat-table [dataSource]="dataSource" matSort class="w-100">

  <!-- Each ng-container block defines ONE column: header + cell -->
  <ng-container matColumnDef="totalIncome">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Income</th>
    <td mat-cell *matCellDef="let row">{{ row.totalIncome | number:'1.2-2' }}</td>
  </ng-container>

  <ng-container matColumnDef="totalCost">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Total Costs</th>
    <td mat-cell *matCellDef="let row">{{ row.totalCost | number:'1.2-2' }}</td>
  </ng-container>

  <ng-container matColumnDef="profitLossValue">
    <th mat-header-cell *matHeaderCellDef mat-sort-header>Profit or Loss</th>
    <td mat-cell *matCellDef="let row">{{ row.profitLossValue | number:'1.2-2' }}</td>
  </ng-container>


  <!-- Defines the two "rows": the header row and the data row -->
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
</div>
@if (isEmpty) {
  <p class="text-muted p-3">No data to show.Make a calculation to see it here.</p>
}
